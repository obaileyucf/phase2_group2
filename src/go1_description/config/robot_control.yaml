controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz, keep <= the Gazebo physics rate
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Holds / moves joint positions with a PD loop that outputs effort.
    # Default controller in normal.launch.py.
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Raw torque commands (Float64MultiArray on /effort_controller/commands).
    # Only one of the two controllers can own the effort interfaces at a time.
    effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # Gains carried over from the ROS1 robot_control.yaml (hip 100/5, thigh and
    # calf 300/8). Check the parameter names against the ros2_controllers docs
    # for your installed Jazzy version.
    gains:
      FL_hip_joint:   {p: 100.0, i: 0.0, d: 5.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      FL_thigh_joint: {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      FL_calf_joint:  {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      FR_hip_joint:   {p: 100.0, i: 0.0, d: 5.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      FR_thigh_joint: {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      FR_calf_joint:  {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RL_hip_joint:   {p: 100.0, i: 0.0, d: 5.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RL_thigh_joint: {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RL_calf_joint:  {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RR_hip_joint:   {p: 100.0, i: 0.0, d: 5.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RR_thigh_joint: {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      RR_calf_joint:  {p: 300.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}

effort_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
