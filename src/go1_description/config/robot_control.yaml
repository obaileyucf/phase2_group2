
controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    # Publishes joint positions and velocities to /joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Custom Unitree Go1 torque controller
    go1_effort_controller:
      type: unitree_guide/Go1JointController


# Custom Go1 controller configuration
go1_effort_controller:
  ros__parameters:
    # MUST match the motor ordering in IOROS.cpp
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint

      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint

      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint

      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
